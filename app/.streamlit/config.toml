# Theme cho web app dự đoán nguy cơ bỏ học
# Dual-mode: người dùng có thể đổi Sáng/Tối trong menu Settings.

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
font = "'Be Vietnam Pro':https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
headingFont = "'Be Vietnam Pro':https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false
headingFontSizes = ["2.1rem", "1.55rem", "1.2rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontSize = "1.9rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1.25rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5FB"
codeBackgroundColor = "#F4F5FB"
textColor = "#16182D"
linkColor = "#4338CA"
borderColor = "#DDE0EE"
redColor = "#D03B3B"
orangeColor = "#C2410C"
yellowColor = "#B7791F"
greenColor = "#0B7A0B"
blueColor = "#2A78D6"
violetColor = "#6250D6"
grayColor = "#5B5F7A"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
chartSequentialColors = ["#eef4fd", "#cde2fb", "#b7d3f6", "#9ec5f4", "#6da7ec", "#3987e5", "#2a78d6", "#1c5cab", "#104281", "#0d366b"]
chartDivergingColors = ["#104281", "#2a78d6", "#6da7ec", "#b7d3f6", "#f0efec", "#f0efec", "#f6b8b0", "#ec7d72", "#d03b3b", "#8f1f1f"]
dataframeBorderColor = "#DDE0EE"
dataframeHeaderBackgroundColor = "#EEF0FA"
dataframeHeaderTextColor = "#16182D"

[theme.dark]
primaryColor = "#7C74F2"
backgroundColor = "#0E1020"
secondaryBackgroundColor = "#181B31"
codeBackgroundColor = "#181B31"
textColor = "#ECEDF7"
linkColor = "#A5A0FA"
borderColor = "#2C3052"
redColor = "#F06A6A"
orangeColor = "#F59E5B"
yellowColor = "#F5C04A"
greenColor = "#3CC23C"
blueColor = "#5B9DEB"
violetColor = "#9085E9"
grayColor = "#A3A7C2"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#0ca30c", "#9085e9", "#e66767"]
chartSequentialColors = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#6da7ec", "#9ec5f4", "#cde2fb"]
chartDivergingColors = ["#6da7ec", "#3987e5", "#256abf", "#184f95", "#383835", "#383835", "#8f2c2c", "#b83a3a", "#e66767", "#f3a3a3"]
dataframeBorderColor = "#2C3052"
dataframeHeaderBackgroundColor = "#1D2140"
dataframeHeaderTextColor = "#ECEDF7"

[theme.sidebar]
paddingTop = "0.75rem"
paddingBottom = "1.5rem"

[theme.light.sidebar]
backgroundColor = "#1E1B4B"
secondaryBackgroundColor = "#2B2766"
codeBackgroundColor = "#2B2766"
textColor = "#EEF0FF"
borderColor = "#3B377D"
primaryColor = "#8B85FF"
linkColor = "#C7C4FF"

[theme.dark.sidebar]
backgroundColor = "#0A0B18"
secondaryBackgroundColor = "#181B31"
codeBackgroundColor = "#181B31"
textColor = "#ECEDF7"
borderColor = "#2C3052"
primaryColor = "#7C74F2"
linkColor = "#A5A0FA"
